name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk YtMp3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YtMp3-apk
          path: YtMp3.apk

      - name: Publier dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: YT MP3 (build ${{ github.run_number }})
          body: Télécharge YtMp3.apk ci-dessous et ouvre-le sur ton téléphone.
          files: YtMp3.apk
          make_latest: true
